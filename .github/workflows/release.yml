name: Release

on:
  push:
    tags:
      - '*' # Triggers on any tag push (e.g., v1.0.0)

permissions:
  contents: write # Needed for GoReleaser to create GitHub Releases

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for GoReleaser to correctly build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # This token is provided automatically by GitHub Actions to create the release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # If you want to use the Homebrew tap feature, uncomment the line below 
          # and comment out the line above. You will need to create a Personal Access Token 
          # with 'repo' scope and save it as a repository secret named HOMEBREW_TAP_TOKEN.
          # GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
